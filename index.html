<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;display:grid;place-items:center;background:#fff}svg{max-width:100%;max-height:100vh;height:auto}</style></head>
<body><svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle with gradient -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3949ab"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="246" fill="url(#grad)" />
  <!-- White calendar background -->
  <rect x="106" y="110" width="300" height="190" rx="40" fill="white" />
  <!-- Calendar top binding rings -->
  <rect x="170" y="70" width="30" height="50" rx="15" fill="#3949ab" />
  <rect x="310" y="70" width="30" height="50" rx="15" fill="#3949ab" />
  <!-- Calendar dots -->
  <circle cx="170" cy="170" r="14" fill="#3949ab" />
  <circle cx="230" cy="170" r="14" fill="#3949ab" />
  <circle cx="290" cy="170" r="14" fill="#3949ab" />
  <circle cx="350" cy="170" r="14" fill="#3949ab" />
  <circle cx="170" cy="220" r="14" fill="#3949ab" fill-opacity="0.3" />
  <circle cx="230" cy="220" r="14" fill="#3949ab" fill-opacity="0.3" />
  <circle cx="290" cy="220" r="14" fill="#3949ab" fill-opacity="0.3" />
  <circle cx="350" cy="220" r="14" fill="#3949ab" fill-opacity="0.3" />
  <!-- Gold cross -->
  <rect x="240" y="280" width="32" height="56" rx="8" fill="#ffb300" />
  <rect x="218" y="300" width="72" height="20" rx="10" fill="#ffb300" />
  <!-- 2.0 badge -->
  <circle cx="390" cy="135" r="30" fill="#ffb300" />
  <text x="390" y="145" text-anchor="middle" fill="#1a237e" font-size="26" font-weight="bold" font-family="Arial, sans-serif">2.0</text>
  <!-- App name inside circle, below icon -->
  <text x="256" y="425" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Poppins, Arial, sans-serif" letter-spacing="1.4" >
    Pastor’s Scheduler
  </text>
</svg></body></html>
